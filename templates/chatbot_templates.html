<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedicBot — HiMedic AI Chat</title>
  <link rel="icon" href="/static/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    :root{
      --blue:#1d6fe8;--blue-d:#1558c7;--blue-l:#e8f1fd;
      --white:#fff;--mist:#f5f8ff;--text:#0f2044;--sub:#4a6080;--border:#dbe8f8;
      --tr:.3s cubic-bezier(.4,0,.2,1)
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#1045b8 0%,#1d6fe8 40%,#3b8ff5 70%,#60a8f8 100%);display:flex;flex-direction:column;position:relative}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}

    /* HEADER */
    .chat-header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.4rem;background:rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.2);flex-shrink:0}
    .header-left{display:flex;align-items:center;gap:.9rem}
    .bot-avatar{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.15);position:relative}
    .bot-avatar::after{content:'';position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff}
    .header-info h1{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:#fff;line-height:1.2}
    .header-info p{font-size:.78rem;color:rgba(255,255,255,.7);margin-top:.15rem}
    .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#86efac;margin-right:.35rem;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.4)}}
    .header-right{display:flex;align-items:center;gap:.8rem}
    .header-logo img{height:26px}
    .home-link{display:flex;align-items:center;gap:.4rem;color:rgba(255,255,255,.85);text-decoration:none;font-size:.82rem;font-weight:600;padding:.4rem .9rem;border-radius:99px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);transition:all var(--tr)}
    .home-link:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6);color:#fff}

    /* CHAT AREA */
    .chat-area{flex:1;overflow-y:auto;padding:1.5rem 1rem;position:relative;z-index:1;scroll-behavior:smooth}
    .chat-area::-webkit-scrollbar{width:5px}
    .chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:99px}

    /* MESSAGES */
    .msg-row{display:flex;align-items:flex-end;gap:.75rem;margin-bottom:1.2rem;animation:msgIn .3s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .msg-row.user{flex-direction:row-reverse}
    .msg-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center}
    .bot-av{background:#fff;display:flex;align-items:center;justify-content:center;font-size:.95rem;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .user-av{background-image:url(/static/images/userprofile.png)}
    .bubble{max-width:min(480px,72vw);padding:.85rem 1.1rem;border-radius:18px;font-size:.9rem;line-height:1.6;word-wrap:break-word}
    .bubble.bot{background:rgba(255,255,255,.18);backdrop-filter:blur(12px);color:#fff;border-bottom-left-radius:4px;border:1px solid rgba(255,255,255,.25)}
    .bubble.user{background:#fff;color:var(--blue);border-bottom-right-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.1);font-weight:500}

    /* TYPING */
    .typing-bubble{background:rgba(255,255,255,.18);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);border-radius:18px;border-bottom-left-radius:4px;padding:.75rem 1rem;display:flex;align-items:center;gap:5px}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);animation:typingBounce .9s ease-in-out infinite}
    .typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes typingBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}

    /* DATE DIVIDER */
    .date-divider{text-align:center;margin:1rem 0;color:rgba(255,255,255,.45);font-size:.75rem;display:flex;align-items:center;gap:.8rem}
    .date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.2)}

    /* QUICK REPLIES */
    .quick-replies{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem;margin-bottom:.3rem;padding-left:46px}
    .quick-btn{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;padding:.4rem .85rem;border-radius:99px;font-size:.8rem;cursor:pointer;transition:all var(--tr);font-family:'DM Sans',sans-serif;backdrop-filter:blur(8px)}
    .quick-btn:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.6)}

    /* INPUT */
    .chat-input-wrap{position:relative;z-index:10;padding:.9rem 1rem;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.2);flex-shrink:0}
    .input-row{display:flex;align-items:center;gap:.7rem;max-width:860px;margin:0 auto;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:99px;padding:.35rem .35rem .35rem 1.1rem;transition:border-color var(--tr),background var(--tr)}
    .input-row:focus-within{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.22)}
    #textInput{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:.95rem;font-family:'DM Sans',sans-serif;padding:.5rem 0;min-width:0}
    #textInput::placeholder{color:rgba(255,255,255,.5)}
    .send-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform var(--tr),box-shadow var(--tr);flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .send-btn:hover{transform:scale(1.08);box-shadow:0 6px 18px rgba(0,0,0,.2)}
    .send-btn:active{transform:scale(.96)}
    .send-btn svg{width:18px;height:18px;fill:var(--blue)}
    .input-hint{text-align:center;color:rgba(255,255,255,.35);font-size:.73rem;margin-top:.5rem}

    @media(max-width:480px){.bubble{max-width:82vw}.header-logo{display:none}.input-hint{display:none}}
  </style>
</head>
<body>

<header class="chat-header">
  <div class="header-left">
    <div class="bot-avatar">🤖</div>
    <div class="header-info">
      <h1>MedicBot</h1>
      <p><span class="status-dot"></span>Online — siap membantu</p>
    </div>
  </div>
  <div class="header-right">
    <a href="{{ url_for('home') }}" class="home-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Beranda
    </a>
    <a href="{{ url_for('home') }}" class="header-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="HiMedic">
    </a>
  </div>
</header>

<div class="chat-area" id="chatArea">
  <div class="date-divider">Hari ini</div>
  <div class="msg-row bot" id="welcomeMsg">
    <div class="msg-avatar bot-av">🤖</div>
    <div class="bubble bot">
      Halo! Saya <strong>MedicBot</strong> 😊<br><br>
      Saya siap membantu menjawab pertanyaanmu seputar <strong>kolesterol</strong>, <strong>asam urat</strong>, dan <strong>gula darah</strong>. Silakan tanya apa saja!
    </div>
  </div>
  <div class="quick-replies" id="quickReplies">
    <button class="quick-btn" onclick="sendQuick('Apa itu kolesterol?')">🫀 Apa itu kolesterol?</button>
    <button class="quick-btn" onclick="sendQuick('Gejala asam urat tinggi?')">🦴 Gejala asam urat?</button>
    <button class="quick-btn" onclick="sendQuick('Cara mencegah diabetes?')">🩸 Cegah diabetes?</button>
  </div>
</div>

<div class="chat-input-wrap">
  <div class="input-row">
    <input type="text" id="textInput" placeholder="Ketik pertanyaanmu di sini..." autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
    </button>
  </div>
  <p class="input-hint">Tekan Enter atau klik tombol kirim</p>
</div>

<script>
  const chatArea = document.getElementById('chatArea');
  function scrollBottom(){ chatArea.scrollTo({top:chatArea.scrollHeight,behavior:'smooth'}); }
  function appendMsg(side, text){
    const row = document.createElement('div');
    row.className = 'msg-row ' + side;
    const isBot = side === 'bot';
    row.innerHTML = `<div class="msg-avatar ${isBot?'bot-av':''}" ${isBot?'':'style="background-image:url(/static/images/userprofile.png)"'}>${isBot?'🤖':''}</div><div class="bubble ${side}">${text}</div>`;
    chatArea.appendChild(row); scrollBottom();
  }
  function showTyping(){
    const row = document.createElement('div'); row.className='msg-row bot'; row.id='typingIndicator';
    row.innerHTML=`<div class="msg-avatar bot-av">🤖</div><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    chatArea.appendChild(row); scrollBottom();
  }
  function removeTyping(){ const t=document.getElementById('typingIndicator'); if(t) t.remove(); }
  function sendMessage(){
    const input = document.getElementById('textInput');
    const text = input.value.trim(); if(!text) return;
    const qr = document.getElementById('quickReplies'); if(qr) qr.remove();
    input.value = ''; appendMsg('user', escapeHtml(text));
    document.getElementById('sendBtn').disabled = true;
    showTyping();
    $.get('/get', {msg: text}).done(function(data){ removeTyping(); appendMsg('bot', data); document.getElementById('sendBtn').disabled=false; })
    .fail(function(){ removeTyping(); appendMsg('bot','Maaf, terjadi kesalahan. Silakan coba lagi. 😔'); document.getElementById('sendBtn').disabled=false; });
  }
  function sendQuick(text){ document.getElementById('textInput').value=text; sendMessage(); }
  function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  document.getElementById('textInput').addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
</script>
</body>
</html>
